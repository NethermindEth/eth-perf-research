services:
  nethermind:
    image: nethermindeth/nethermind:bloating-test-2026-04-28
    read_only: true
    volumes:
      - type: bind
        source: ./nethermind-data
        target: /nethermind/db
      - type: bind
        source: ${LAB_GENESIS_PATH:-./lab-genesis.json}
        target: /nethermind/chainspec/lab-genesis.json
        read_only: true
      # Shared tmpfs-backed volume (declared below). Using a named volume
      # lets jwt-init, nethermind, and orchestrator see the SAME file —
      # per-service `type: tmpfs` mounts are isolated per container and would
      # leave Nethermind reading an empty /run/jwt (security L-COMPOSE).
      - type: volume
        source: jwt
        target: /run/jwt
    command:
      - --Init.ChainSpecPath=/nethermind/chainspec/lab-genesis.json
      - --Init.DiscoveryEnabled=false
      - --Init.StaticNodesPath=Data/static-nodes.json
      - --Init.TrustedNodesPath=Data/trusted-nodes.json
      - --Sync.NetworkingEnabled=false
      - --Sync.SynchronizationEnabled=false
      - --JsonRpc.Host=0.0.0.0
      - --JsonRpc.Port=8545
      - --JsonRpc.EnabledModules=Eth,Net,Web3,Statecomp,Testing
      - --JsonRpc.EnginePort=8551
      - --JsonRpc.EngineHost=0.0.0.0
      - --JsonRpc.JwtSecretFile=/run/jwt/jwt.hex
      - --JsonRpc.AdditionalRpcUrls=http://127.0.0.1:8547|http|Admin;Debug;Trace;Personal;Testing;TxPool
      - --StateComposition.Enabled=true
    ports:
      - "8545:8545"
      - "8551:8551"
    tmpfs:
      - /tmp:size=128m
      - /nethermind/keystore:size=8m
      - /nethermind/logs:size=128m
      - /nethermind/Data:size=8m
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/localhost/8545 && echo OK' || exit 1"
      interval: 5s
      timeout: 3s
      retries: 24

  jwt-init:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "/scripts/gen-jwt.sh"]
    volumes:
      - type: volume
        source: jwt
        target: /run/jwt
      - type: bind
        source: ./scripts
        target: /scripts
        read_only: true
    restart: "no"

  orchestrator:
    build: .
    depends_on:
      nethermind:
        condition: service_healthy
      jwt-init:
        condition: service_completed_successfully
    environment:
      - NODE_RPC=http://nethermind:8545
      - ENGINE_RPC=http://nethermind:8551
      - JWT_PATH=/run/jwt/jwt.hex
      - STATE_DIR=/app/state
      - ORCH_SANITY_GATE_MULTIPLIER=0
      - ORCH_PROBE_TX_COUNT=10
      # Overshoot detector relaxed for the demo (default 0.20 trips often on
      # near-convergence runs). 10.0 keeps the safety net for runaways.
      - ORCH_OVERSHOOT_THRESHOLD=10.0
      # Convergence knobs (see final-design-v3.md §4.1 + Appendix D ablation).
      # Defaults below are the post-ablation ship recommendations:
      #   ε=0.1: 15% faster + 50% more F coverage than argmax (winning)
      #   gas_aware=1: cap cumulative batch gas at 0.95×block_gas_limit
      #   penalty=0: current λ formulation overwhelms gradient; do not enable
      #   residual_stop=0: target_reached fires first on byte-bound runs
      # Override via shell env when running experiments / ablations.
      - ORCH_EPSILON=${ORCH_EPSILON:-0.1}
      - ORCH_OVERSHOOT_PENALTY=${ORCH_OVERSHOOT_PENALTY:-0.0}
      - ORCH_GAS_AWARE_DISPATCH=${ORCH_GAS_AWARE_DISPATCH:-1}
      - ORCH_RESIDUAL_STOP_THRESHOLD=${ORCH_RESIDUAL_STOP_THRESHOLD:-0.0}
      - ORCH_RESIDUAL_STOP_WINDOW=${ORCH_RESIDUAL_STOP_WINDOW:-6}
    volumes:
      - type: volume
        source: jwt
        target: /run/jwt
      - type: bind
        source: ./state
        target: /app/state
      - type: bind
        source: ./target.yaml
        target: /app/target.yaml
        read_only: true
    command:
      - --rpc-url=${NODE_RPC:-http://nethermind:8545}
      - --state-dir=/app/state
      - --target-yaml=/app/target.yaml
      - --genesis-sha256=2819c70927e07867ed2de8f1498dfc8a84562753577b443dd09d652c00af3134
      - --plugin-git-sha=1253d26424c5d6ec7352d4ce23bb50452a0402c9
      - --nethermind-commit-sha=1253d26424c5d6ec7352d4ce23bb50452a0402c9
      - --dotnet-runtime-major=10
      - --max-batches=1500

volumes:
  jwt:
    driver_opts:
      type: tmpfs
      device: tmpfs
