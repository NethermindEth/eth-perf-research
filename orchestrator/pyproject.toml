[project]
name = "orchestrator"
version = "0.1.0"
description = "Bloating feedback-loop orchestrator for Nethermind state composition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-only" }
authors = [{ name = "Nethermind" }]

dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rlp>=4.0",
    "eth-account>=0.11",
    # Pin coincurve explicitly: eth-account uses it as a fast secp256k1 backend
    # when present and silently falls back to the ~100× slower pure-Python
    # `eth-keys` path when it's missing. An explicit pin prevents a resolver
    # hiccup from degrading per-tx signing throughput.
    "coincurve>=19",
    "typer>=0.12",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[project.scripts]
orchestrator = "orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
