# Shared config for legacy-compatible linters that don't read pyproject.toml.
# Ruff (our primary linter) is configured in pyproject.toml.
[pycodestyle]
max-line-length = 100
# E203 (whitespace before ':') — wrong for modern slice formatting; black/ruff
#   emit `a[nl + 1 :]` which PEP 8 itself now endorses.
# E704 (statement on same line as def) — allows `def close(self) -> None: ...`
#   stub bodies used in test doubles.
# W503 (line break before binary operator) — PEP 8's current recommendation is
#   the OPPOSITE of pycodestyle's default; W504 is what modern style wants.
ignore = E203,E704,W503

[flake8]
max-line-length = 100
extend-ignore = E203,E704,W503
