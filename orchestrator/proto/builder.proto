syntax = "proto3";

package builder;

option go_package = "github.com/NethermindEth/eth-perf-research/orchestrator/internal/orchpb;orchpb";

import "txsigner.proto";

message FacadeCtxParams {
  bytes base_address = 1;
  uint64 revision = 2;
  uint64 chain_id = 3;
  uint64 block_gas_limit = 4;
  uint64 salt_cursor = 5;
  map<string, double> verb_gas_factors = 6;
  uint64 address_stride = 7;
}

message BuildBatchRequest {
  uint64 id = 1;
  string verb = 2;
  uint64 start_idx = 3;
  uint32 count = 4;
  FacadeCtxParams ctx = 5;
}

message BuildDiag {
  string json = 1;
}

message BuildBatchResponse {
  uint64 id = 1;
  repeated txsigner.TxIn signables = 2;
  repeated BuildDiag diags = 3;
  string error = 4;
  uint64 new_salt_cursor = 5;
}
