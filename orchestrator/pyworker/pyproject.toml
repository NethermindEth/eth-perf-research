[project]
name = "builder-worker"
version = "0.1.0"
description = "Subprocess shim hosting orchestrator-py verb builders for the Go orchestrator"
requires-python = ">=3.11"
dependencies = [
  "protobuf>=4.25",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["builder_worker*"]
