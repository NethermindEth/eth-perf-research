[project]
name = "orchestrator"
version = "0.1.0"
description = "Bloating feedback-loop orchestrator for Nethermind state composition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-only" }
authors = [{ name = "Nethermind" }]

dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rlp>=4.0",
    "eth-account>=0.11",
    # Pin coincurve explicitly: eth-account uses it as a fast secp256k1 backend
    # when present and silently falls back to the ~100× slower pure-Python
    # `eth-keys` path when it's missing. An explicit pin prevents a resolver
    # hiccup from degrading per-tx signing throughput.
    "coincurve>=19",
    "typer>=0.12",
    "jsonschema>=4.21",
    # Spamoor tx builders, sourced from execution-specs `feat/spamoor-to-est`
    # (Dmytro's PR) via the sibling pyproject we added in
    # NethermindEth/execution-specs#3. Pinned to a SHA on the branch so the
    # graph stays reproducible until that PR + Dmytro's parent merge to main.
    "eels-spamoor-builders @ git+https://github.com/NethermindEth/execution-specs.git@c1b46499b83489cd9758be135362cf1ddca84dad#subdirectory=tests/benchmark/spamoor",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "mypy>=1.11",
    "bandit>=1.7",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Baseline: only complain about real defects. Tighten to --strict in CI later.
warn_unused_ignores = true
warn_redundant_casts = true

# Tests pass structurally-compatible stubs (e.g. `_StubRpc` where `RpcClient` is expected)
# to exercise behaviour without spinning up real clients. The stubs are deliberately
# duck-typed — nominal arg-type checking in tests would force a Protocol layer that
# buys nothing for the test suite. Mirrors the `pyrightconfig.json` tests/ override.
[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["arg-type"]

[tool.bandit]
# B101 assert_used: pytest test asserts are expected; `# noqa` for any intentional
# runtime assert in non-test code.
# B404/B603/B607 subprocess: the orchestrator doesn't run subprocesses.
exclude_dirs = ["tests", ".venv", ".pytest_cache"]
skips = ["B101"]

[project.scripts]
orchestrator = "orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

# Required by hatchling to accept the eels-spamoor-builders git URL in
# [project.dependencies]; without this it refuses direct references.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
# Any warning (deprecation, resource, etc.) from our code or our deps fails
# the test, so dependency bumps that introduce noise get caught in CI.
filterwarnings = [
    "error",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear (real bugs)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (modernize syntax)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "PTH", # pathlib over os.path
    "RET", # flake8-return
    "ARG", # unused arguments
]
ignore = [
    "E501",    # line-too-long — the formatter handles real code; long URLs in
               # docstrings would false-positive.
    "RUF001",  # ambiguous unicode in strings (§, ×, …) — intentional in spec
               # cross-refs and operator-facing error messages.
    "RUF002",  # ambiguous unicode in docstrings — same as above.
    "RUF003",  # ambiguous unicode in comments — same as above.
    "B008",    # `typer.Option(...)` in defaults is the canonical Typer pattern.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG001",  # unused fixture args are idiomatic pytest
    "ARG002",
    "B011",    # assert False in test helpers
]
"src/orchestrator/cli.py" = [
    "ARG001",  # Typer callback receives ctx even when unused
]
# One-off plotly report script. Keeps stylistic divergence from the rest of
# the codebase (dict() literals are idiomatic in plotly examples).
"scripts/orchestrator_report.py" = [
    "B007",   # ``for i, v in enumerate(...)`` reads naturally even when v unused.
    "B905",   # ``zip(...)`` strict= over a fixed-shape pair.
    "C408",   # plotly's idiom is ``dict(l=80, r=20, ...)``.
    "C416",   # comprehensions over pandas Series are fine.
    "F541",   # one-off f-string preserved for grep symmetry.
]
